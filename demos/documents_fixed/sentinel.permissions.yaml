version: 1
tools:
  create_note:
    filesystem:
      read: {scopes: []}
      write:
        scopes: ["documents/**"]
        broad_scope_justification: "Kullanıcı not adı seçer; çözümlenen yol documents kökü altında doğrulanır."
    network: {scopes: []}
  read_note:
    filesystem:
      read:
        scopes: ["documents/**"]
        broad_scope_justification: "Kullanıcı not adı seçer; çözümlenen yol documents kökü altında doğrulanır."
      write: {scopes: []}
    network: {scopes: []}
  list_notes:
    filesystem:
      read:
        scopes: ["documents/**"]
        broad_scope_justification: "Araç documents kökünde mevcut notları listeler; dinamik listeleme için dizin kapsamı gereklidir."
      write: {scopes: []}
    network: {scopes: []}
  search_notes:
    filesystem:
      read:
        scopes: ["documents/**"]
        broad_scope_justification: "Arama documents altındaki seçili notları yardımcı doğrulayıcı üzerinden okur."
      write: {scopes: []}
    network: {scopes: []}

